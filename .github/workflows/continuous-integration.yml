name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.os }} - PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        dependencies: [lowest, highest]
        include:
          - os: windows-latest
            php-version: "8.5"
            dependencies: highest
          - os: macos-latest
            php-version: "8.5"
            dependencies: highest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
          # bear/resource requires ext-fileinfo from 1.26, and the Windows build does not enable it by default.
          extensions: fileinfo

      - name: Install dependencies
        run: composer update ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }} --ansi --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit
